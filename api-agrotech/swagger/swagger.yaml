openapi: 3.0.0
info:
  title: API AgriBusiness - Sistema Inteligente para o Agronegócio
  description: API REST para monitoramento de irrigação, sensores e alertas
  version: 1.0.0

servers:
  - url: http://localhost:3000/api
    description: Servidor de desenvolvimento local

paths:
  /auth/login:
    post:
      summary: Autentica um usuário e retorna JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: teste@agri.com
                password:
                  type: string
                  example: 123456
      responses:
        '200':
          description: Login bem-sucedido
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    type: object
        '401':
          description: Credenciais inválidas

  /sensores:
    get:
      summary: Retorna dados atuais dos sensores
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dados dos sensores
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                  lastUpdate:
                    type: string

  /irrigacao/acionar:
    post:
      summary: Aciona irrigação manualmente
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                durationMinutes:
                  type: integer
                  example: 30
      responses:
        '200':
          description: Irrigação acionada
        '401':
          description: Não autorizado

  /irrigacao/status:
    get:
      summary: Retorna status atual da irrigação
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Status da irrigação

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT